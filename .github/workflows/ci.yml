name: VPS Deploy CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: chaitanyalohani/commitlog-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: chaitanyalohani/commitlog-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.ALLOWED_ORIGINS }}
            EDGE_STORE_ACCESS_KEY=${{ secrets.EDGE_STORE_ACCESS_KEY }}
            EDGE_STORE_SECRET_KEY=${{ secrets.EDGE_STORE_SECRET_KEY }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env file locally
        env:
          SECRET_ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
          SECRET_REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
          SECRET_ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SECRET_ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          SECRET_ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          SECRET_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SECRET_MONGODB_URL: ${{ secrets.MONGODB_URL }}
          SECRET_REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_MONGO_USER: ${{ secrets.MONGO_USER }}
          SECRET_MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          SECRET_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          SECRET_EDGE_STORE_ACCESS_KEY: ${{ secrets.EDGE_STORE_ACCESS_KEY }}
          SECRET_EDGE_STORE_SECRET_KEY: ${{ secrets.EDGE_STORE_SECRET_KEY }}
        run: |
          printf 'ACCESS_TOKEN_SECRET=%s\n' "${SECRET_ACCESS_TOKEN_SECRET}" >> /tmp/app.env
          printf 'REFRESH_TOKEN_SECRET=%s\n' "${SECRET_REFRESH_TOKEN_SECRET}" >> /tmp/app.env
          printf 'ALLOWED_ORIGINS=%s\n' "${SECRET_ALLOWED_ORIGINS}" >> /tmp/app.env
          printf 'ADMIN_NAME=%s\n' "${SECRET_ADMIN_NAME}" >> /tmp/app.env
          printf 'ADMIN_EMAIL=%s\n' "${SECRET_ADMIN_EMAIL}" >> /tmp/app.env
          printf 'ADMIN_PASSWORD=%s\n' "${SECRET_ADMIN_PASSWORD}" >> /tmp/app.env
          printf 'MONGODB_URL=%s\n' "${SECRET_MONGODB_URL}" >> /tmp/app.env
          printf 'REDIS_URL=%s\n' "${SECRET_REDIS_URL}" >> /tmp/app.env
          printf 'MONGO_USER=%s\n' "${SECRET_MONGO_USER}" >> /tmp/app.env
          printf 'MONGO_PASSWORD=%s\n' "${SECRET_MONGO_PASSWORD}" >> /tmp/app.env
          printf 'REDIS_PASSWORD=%s\n' "${SECRET_REDIS_PASSWORD}" >> /tmp/app.env
          printf 'EDGE_STORE_ACCESS_KEY=%s\n' "${SECRET_EDGE_STORE_ACCESS_KEY}" >> /tmp/app.env
          printf 'EDGE_STORE_SECRET_KEY=%s\n' "${SECRET_EDGE_STORE_SECRET_KEY}" >> /tmp/app.env

      - name: Copy files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "mkdir -p ${VPS_APP_DIR}/nginx/certs"
          scp -P "${VPS_PORT}" /tmp/app.env "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/.env"
          scp -P "${VPS_PORT}" docker-compose.yml "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/docker-compose.yml"
          scp -P "${VPS_PORT}" -r nginx/config "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/nginx/"
          scp -P "${VPS_PORT}" nginx/Dockerfile "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/nginx/Dockerfile"

      - name: Deploy on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "cd ${VPS_APP_DIR} && docker compose pull && docker compose up -d --build --remove-orphans && docker compose ps"

      - name: Health check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sleep 30
          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "curl -fsS http://127.0.0.1/api/health || (docker compose -f /root/app/docker-compose.yml logs --tail=50 backend && exit 1)"

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const shortSha = context.sha.substring(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Deploy Failure] main @ ${shortSha}`,
              body: `Deployment failed.\n\nRun: ${runUrl}`,
              labels: ["ci", "deployment", "bug"]
            });