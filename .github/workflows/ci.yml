name: VPS Deploy CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vps-deploy-main
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: chaitanyalohani/commitlog-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: chaitanyalohani/commitlog-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.ALLOWED_ORIGINS }}
            EDGE_STORE_ACCESS_KEY=${{ secrets.EDGE_STORE_ACCESS_KEY }}
            EDGE_STORE_SECRET_KEY=${{ secrets.EDGE_STORE_SECRET_KEY }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          # Copy docker-compose.yml to VPS
          scp -P "${VPS_PORT}" docker-compose.yml "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/docker-compose.yml"

          # Copy nginx folder to VPS
          scp -P "${VPS_PORT}" -r nginx "${VPS_USER}@${VPS_HOST}:${VPS_APP_DIR}/"

          ssh -p "${VPS_PORT}" "${VPS_USER}@${VPS_HOST}" "bash -s" <<EOF
          set -euo pipefail

          mkdir -p ${VPS_APP_DIR}
          cd ${VPS_APP_DIR}

          # Write .env file
          cat > .env <<'ENVEOF'
ACCESS_TOKEN_SECRET=${{ secrets.ACCESS_TOKEN_SECRET }}
REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS }}
ADMIN_NAME=${{ secrets.ADMIN_NAME }}
ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
MONGODB_URL=${{ secrets.MONGODB_URL }}
REDIS_URL=${{ secrets.REDIS_URL }}
MONGO_USER=${{ secrets.MONGO_USER }}
MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}
REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
EDGE_STORE_ACCESS_KEY=${{ secrets.EDGE_STORE_ACCESS_KEY }}
EDGE_STORE_SECRET_KEY=${{ secrets.EDGE_STORE_SECRET_KEY }}
ENVEOF

          # Pull latest images and deploy
          docker compose pull
          docker compose up -d --remove-orphans

          echo "Container status:"
          docker compose ps

          # Health check
          HEALTH_OK="false"
          for i in {1..18}; do
            if curl -fsS http://127.0.0.1/api/health >/dev/null 2>&1; then
              HEALTH_OK="true"
              break
            fi
            sleep 5
          done

          if [[ "\${HEALTH_OK}" != "true" ]]; then
            echo "Health check failed"
            docker compose logs --tail=50 backend || true
            exit 1
          fi

          echo "Deploy successful"
          EOF

      - name: Create GitHub issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const shortSha = context.sha.substring(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Deploy Failure] main @ ${shortSha}`,
              body: `Deployment failed.\n\nRun: ${runUrl}`,
              labels: ["ci", "deployment", "bug"]
            });
