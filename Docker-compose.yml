version: '3.9'
services: 
  nginx:
    build: ./nginx
    ports:
    - "8080:80"
    environment:
    - NGINX_PORT=80

  backend:
    build: ./backend
    ports: 
      - "3001:3001"
    environment:
      - "PORT=3001"
      - "NODE_ENV=production"
      - "JWT_SECRET=your_jwt_secret_key"
      - "ALLOWED_ORIGINS=http://localhost:8080"
      - "MONGODB_URL=mongodb://mongo:27017/student-intership-portal"
      - "REDIS_URL=redis://redis:6379"
    depends_on:
      - mongo
      - redis
      - nginx

  frontend:
    build: ./frontend
    ports: 
      - "3000:3000"
    environment:
      - "NEXT_PUBLIC_API_URL=http://localhost:8080"
      - "EDGE_STORE_ACCESS_KEY=La9WTouTQKjn6uyvdxIgFTp6w7LBKow6"
      - "EDGE_STORE_SECRET_KEY=RjDGS1DlEbtq7R9jlFggPgVnGT2RfRBzygpj8WpU9hy4jzun"
    depends_on: 
      - backend
      - nginx
    
  mongo:
    image: mongo:8
    restart: always
    ports:
      - "27017:27017"
    volumes: 
      - mongo_data:/data/db

  redis: 
    image: redis:7
    restart: always
    ports: 
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
